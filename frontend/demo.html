<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ModelHunter UI review build — runs against an in-browser mock API." />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html { background: #E8EAE6; color-scheme: light; }
      html[data-theme="dark"] { background: #161918; color-scheme: dark; }
    </style>
    <script>
      (function () {
        var t = "system";
        try { t = (JSON.parse(localStorage.getItem("mh.ui-prefs.v2") || "{}").theme) || "system"; } catch (e) {}
        var dark = t === "dark" || (t === "system" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
    <title>ModelHunter — UI Review (demo data)</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/demo/main.demo.jsx"></script>
  </body>
</html>
