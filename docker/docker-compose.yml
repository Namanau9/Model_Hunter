services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: modelhunter-backend
    ports:
      - "8000:8000"
    volumes:
      - ./../datasets:/app/datasets
      - ./../pretrained_models:/app/pretrained_models
      - ./../reports:/app/reports
    environment:
      - DEVICE=auto
      - DATABASE_URL=sqlite:////app/backend/modelhunter.db

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: modelhunter-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
